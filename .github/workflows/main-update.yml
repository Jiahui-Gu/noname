name: Main Update

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: main-update
    cancel-in-progress: false

jobs:
    publish:
        name: Publish Main Update
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Install pnpm
              uses: pnpm/action-setup@v5
              with:
                  version: 10
                  run_install: false

            - name: Install Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Resolve published baseline
              id: baseline
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  update_before=""
                  rm -rf release-baseline
                  mkdir release-baseline

                  if gh release view main-latest >/dev/null 2>&1; then
                    if git fetch --force origin \
                      refs/tags/main-latest:refs/tags/main-latest \
                      >/dev/null 2>&1; then
                      candidate="$(git rev-parse --verify \
                        'refs/tags/main-latest^{commit}' 2>/dev/null || true)"
                      assets="$(gh release view main-latest \
                        --json assets \
                        --jq '[.assets[].name] | sort | join(" ")' \
                        2>/dev/null || true)"

                      if [[ "$candidate" =~ ^[0-9a-f]{40}$ ]] &&
                        [[ " $assets " == *" main-update.json "* ]] &&
                        [[ " $assets " == *" noname-main.zip "* ]] &&
                        gh release download main-latest \
                          --pattern main-update.json \
                          --dir release-baseline \
                          --clobber >/dev/null 2>&1; then
                        published_commit="$(jq -er \
                          '.commit | select(type == "string")' \
                          release-baseline/main-update.json 2>/dev/null || true)"
                        if [[ "$published_commit" == "$candidate" ]]; then
                          update_before="$candidate"
                        fi
                      fi
                    fi
                  fi

                  echo "update_before=$update_before" >>"$GITHUB_OUTPUT"

            - name: Build main package
              env:
                  NONAME_BUILD_CHANNEL: nightly
                  NONAME_BUILD_COMMIT: ${{ github.sha }}
              run: pnpm build

            - name: Archive main package
              shell: bash
              run: |
                  mkdir -p release
                  cd dist
                  7z a ../release/noname-main.zip .

            - name: Create update manifest
              env:
                  UPDATE_COMMIT: ${{ github.sha }}
                  UPDATE_BEFORE: ${{ steps.baseline.outputs.update_before }}
                  UPDATE_PACKAGE: release/noname-main.zip
                  UPDATE_OUTPUT: release/main-update.json
              run: pnpm exec tsx scripts/create-main-update-manifest.ts

            - name: Publish prerelease
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if gh release view main-latest >/dev/null 2>&1; then
                    gh release edit main-latest \
                      --title "Main Latest" \
                      --prerelease \
                      --latest=false

                    gh release upload main-latest \
                      release/main-update.json \
                      release/noname-main.zip \
                      --clobber

                    git tag --force main-latest "$GITHUB_SHA"
                    git push origin refs/tags/main-latest --force
                  else
                    gh release create main-latest \
                      --target "$GITHUB_SHA" \
                      --title "Main Latest" \
                      --notes "Rolling build from the main branch." \
                      --prerelease \
                      --latest=false

                    gh release upload main-latest \
                      release/main-update.json \
                      release/noname-main.zip \
                      --clobber
                  fi
